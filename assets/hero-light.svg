<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Kenneth Julés — QA engineer</title>
  <desc id="desc">A light banner with the name Kenneth Julés, the line "finding the cracks before your users do", and an animated orbital shield-check mark.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FCFDF9"/>
      <stop offset="0.55" stop-color="#F7F9F1"/>
      <stop offset="1" stop-color="#F1F5E9"/>
    </linearGradient>

    <radialGradient id="glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(975 175) rotate(90) scale(300)">
      <stop stop-color="#8FCB4B" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#8FCB4B" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="nameFill" x1="64" y1="0" x2="520" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#101314"/>
      <stop offset="0.42" stop-color="#101314"/>
      <stop offset="0.50" stop-color="#6FA82B"/>
      <stop offset="0.58" stop-color="#101314"/>
      <stop offset="1" stop-color="#101314"/>
      <animate attributeName="x1" values="-260;520" dur="7s" begin="2s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="-80;700" dur="7s" begin="2s" repeatCount="indefinite"/>
    </linearGradient>

    <linearGradient id="hairline" x1="64" y1="0" x2="1136" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#6FA82B" stop-opacity="0"/>
      <stop offset="0.35" stop-color="#6FA82B" stop-opacity="0.45"/>
      <stop offset="0.65" stop-color="#6FA82B" stop-opacity="0"/>
    </linearGradient>

    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.5" fill="#0B0C0E" fill-opacity="0.05"/>
    </pattern>

    <clipPath id="cardClip">
      <rect width="1200" height="360" rx="28"/>
    </clipPath>

    <clipPath id="reveal">
      <rect x="84" y="244" width="0" height="34">
        <animate attributeName="width" from="0" to="653" begin="0.4s" dur="1.4s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines="0.22 0.61 0.36 1"/>
      </rect>
    </clipPath>

    <style>
      text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      }
      .mono {
        font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
      }
      .orbit-a, .orbit-b, .orbit-c, .float, .dot-drift {
        transform-box: view-box;
      }
      .orbit-a {
        animation: spin 32s linear infinite;
        transform-origin: 975px 175px;
      }
      .orbit-b {
        animation: spin 24s linear infinite;
        transform-origin: 975px 175px;
      }
      .orbit-c {
        animation: spin 18s linear infinite reverse;
        transform-origin: 975px 175px;
      }
      .float {
        animation: float 7s ease-in-out infinite;
      }
      .dot-drift {
        animation: drift 18s linear infinite;
      }
      .pulse {
        animation: pulse 2.6s ease-in-out infinite;
      }
      .caret {
        opacity: 0;
        animation: blink 1.1s step-end 2s infinite;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
      @keyframes float {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-4px); }
      }
      @keyframes drift {
        to { transform: translate(28px, 28px); }
      }
      @keyframes pulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.35; }
      }
      @keyframes blink {
        0%, 49% { opacity: 1; }
        50%, 100% { opacity: 0; }
      }
      @media (prefers-reduced-motion: reduce) {
        .orbit-a, .orbit-b, .orbit-c, .float, .dot-drift, .pulse {
          animation: none !important;
        }
        .caret {
          animation: none !important;
          opacity: 1;
        }
      }
    </style>
  </defs>

  <g clip-path="url(#cardClip)">
    <rect width="1200" height="360" fill="url(#bg)"/>
    <rect x="-56" y="-56" width="1312" height="472" fill="url(#dots)" class="dot-drift"/>
    <rect width="1200" height="360" fill="url(#glow)"/>
    <rect x="64" y="0" width="1072" height="1" fill="url(#hairline)"/>

    <g transform="translate(64 56)">
      <rect width="150" height="30" rx="15" fill="#FFFFFF" fill-opacity="0.8" stroke="#E2E6DA"/>
      <circle cx="17" cy="15" r="3.2" fill="#5F941F" class="pulse"/>
      <text x="30" y="19.5" font-size="10.5" font-weight="600" letter-spacing="2.2" fill="#626A60">QA ENGINEER</text>
    </g>

    <text x="64" y="172" font-size="64" font-weight="600" letter-spacing="-1.8" fill="url(#nameFill)">kenneth julés</text>
    <text x="64" y="212" font-size="19" fill="#5D655D" letter-spacing="0.1">finding the cracks before your users do.</text>

    <text x="64" y="268" font-size="17" fill="#5F941F" class="mono">$</text>
    <g clip-path="url(#reveal)">
      <text x="84" y="268" font-size="17" fill="#737B71" class="mono" textLength="653" lengthAdjust="spacingAndGlyphs">currently testing — everything that could break, before it ships</text>
    </g>
    <rect x="744" y="251" width="8" height="19" rx="2" fill="#5F941F" class="caret"/>

    <text x="64" y="316" font-size="10.5" font-weight="600" letter-spacing="2.2" fill="#8A9287">PHILIPPINES · GMT+8</text>

    <g>
      <circle cx="975" cy="175" r="128" stroke="#0B0C0E" stroke-opacity="0.07"/>
      <circle cx="975" cy="175" r="96" stroke="#0B0C0E" stroke-opacity="0.10"/>
      <circle cx="975" cy="175" r="64" stroke="#0B0C0E" stroke-opacity="0.13"/>

      <g class="orbit-a">
        <circle cx="975" cy="175" r="96" stroke="#5F941F" stroke-opacity="0.55" stroke-dasharray="64 539" stroke-linecap="round"/>
      </g>

      <g class="orbit-b">
        <circle cx="975" cy="47" r="4" fill="#5F941F"/>
      </g>

      <g class="orbit-c">
        <circle cx="975" cy="111" r="2.5" fill="#0B0C0E" fill-opacity="0.35"/>
      </g>

      <g class="float">
        <rect x="943" y="143" width="64" height="64" rx="18" fill="#FFFFFF" stroke="#E2E6DA"/>
        <g transform="translate(959 159)">
          <path d="M16 3.2L26 7.1V15.4C26 22.4 21.8 27.3 16 29.4C10.2 27.3 6 22.4 6 15.4V7.1L16 3.2Z" fill="#5F941F" fill-opacity="0" stroke="#5F941F" stroke-width="1.6" stroke-linejoin="round" stroke-dasharray="100" stroke-dashoffset="100">
            <animate attributeName="stroke-dashoffset" from="100" to="0" dur="1.2s" begin="0.5s" fill="freeze"/>
            <animate attributeName="fill-opacity" from="0" to="0.10" dur="0.6s" begin="1.4s" fill="freeze"/>
          </path>
          <path d="M11.2 15.9L14.7 19.3L21 12.4" fill="none" stroke="#5F941F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="20" stroke-dashoffset="20">
            <animate attributeName="stroke-dashoffset" from="20" to="0" dur="0.45s" begin="1.5s" fill="freeze"/>
          </path>
        </g>
      </g>
    </g>

    <rect x="0.5" y="0.5" width="1199" height="359" rx="27.5" stroke="#E4E8DC"/>
  </g>
</svg>
