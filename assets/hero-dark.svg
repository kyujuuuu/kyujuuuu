<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Kenneth Julés — Flutter developer</title>
  <desc id="desc">A dark banner with the name Kenneth Julés, the line "building calm software that helps things grow", and an animated orbital sprout mark.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0A0B0D"/>
      <stop offset="0.55" stop-color="#0E1115"/>
      <stop offset="1" stop-color="#12161A"/>
    </linearGradient>

    <radialGradient id="glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(975 175) rotate(90) scale(300)">
      <stop stop-color="#C9F67C" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#C9F67C" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="nameFill" x1="64" y1="0" x2="520" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F6F8F4"/>
      <stop offset="0.42" stop-color="#F6F8F4"/>
      <stop offset="0.50" stop-color="#D8FCA0"/>
      <stop offset="0.58" stop-color="#F6F8F4"/>
      <stop offset="1" stop-color="#F6F8F4"/>
      <animate attributeName="x1" values="-260;520" dur="7s" begin="2s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="-80;700" dur="7s" begin="2s" repeatCount="indefinite"/>
    </linearGradient>

    <linearGradient id="hairline" x1="64" y1="0" x2="1136" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#C9F67C" stop-opacity="0"/>
      <stop offset="0.35" stop-color="#C9F67C" stop-opacity="0.45"/>
      <stop offset="0.65" stop-color="#C9F67C" stop-opacity="0"/>
    </linearGradient>

    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.5" fill="#FFFFFF" fill-opacity="0.05"/>
    </pattern>

    <clipPath id="cardClip">
      <rect width="1200" height="360" rx="28"/>
    </clipPath>

    <clipPath id="reveal">
      <rect x="84" y="244" width="0" height="34">
        <animate attributeName="width" from="0" to="653" begin="0.4s" dur="1.4s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines="0.22 0.61 0.36 1"/>
      </rect>
    </clipPath>

    <style>
      text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      }
      .mono {
        font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
      }
      .orbit-a, .orbit-b, .orbit-c, .float, .dot-drift {
        transform-box: view-box;
      }
      .orbit-a {
        animation: spin 32s linear infinite;
        transform-origin: 975px 175px;
      }
      .orbit-b {
        animation: spin 24s linear infinite;
        transform-origin: 975px 175px;
      }
      .orbit-c {
        animation: spin 18s linear infinite reverse;
        transform-origin: 975px 175px;
      }
      .float {
        animation: float 7s ease-in-out infinite;
      }
      .dot-drift {
        animation: drift 18s linear infinite;
      }
      .pulse {
        animation: pulse 2.6s ease-in-out infinite;
      }
      .caret {
        opacity: 0;
        animation: blink 1.1s step-end 2s infinite;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
      @keyframes float {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-4px); }
      }
      @keyframes drift {
        to { transform: translate(28px, 28px); }
      }
      @keyframes pulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.35; }
      }
      @keyframes blink {
        0%, 49% { opacity: 1; }
        50%, 100% { opacity: 0; }
      }
      @media (prefers-reduced-motion: reduce) {
        .orbit-a, .orbit-b, .orbit-c, .float, .dot-drift, .pulse {
          animation: none !important;
        }
        .caret {
          animation: none !important;
          opacity: 1;
        }
      }
    </style>
  </defs>

  <g clip-path="url(#cardClip)">
    <rect width="1200" height="360" fill="url(#bg)"/>
    <rect x="-56" y="-56" width="1312" height="472" fill="url(#dots)" class="dot-drift"/>
    <rect width="1200" height="360" fill="url(#glow)"/>
    <rect x="64" y="0" width="1072" height="1" fill="url(#hairline)"/>

    <g transform="translate(64 56)">
      <rect width="190" height="30" rx="15" fill="#14181C" fill-opacity="0.72" stroke="#2A3037"/>
      <circle cx="17" cy="15" r="3.2" fill="#C9F67C" class="pulse"/>
      <text x="30" y="19.5" font-size="10.5" font-weight="600" letter-spacing="2.2" fill="#AEB6BC">FLUTTER DEVELOPER</text>
    </g>

    <text x="64" y="172" font-size="64" font-weight="600" letter-spacing="-1.8" fill="url(#nameFill)">kenneth julés</text>
    <text x="64" y="212" font-size="19" fill="#A2AAB0" letter-spacing="0.1">building calm software that helps things grow.</text>

    <text x="64" y="268" font-size="17" fill="#C9F67C" class="mono">$</text>
    <g clip-path="url(#reveal)">
      <text x="84" y="268" font-size="17" fill="#868E95" class="mono" textLength="653" lengthAdjust="spacingAndGlyphs">currently building cropix — a field companion for pechay growers</text>
    </g>
    <rect x="744" y="251" width="8" height="19" rx="2" fill="#C9F67C" class="caret"/>

    <text x="64" y="316" font-size="10.5" font-weight="600" letter-spacing="2.2" fill="#5A626A">PHILIPPINES · GMT+8</text>

    <g>
      <circle cx="975" cy="175" r="128" stroke="#FFFFFF" stroke-opacity="0.06"/>
      <circle cx="975" cy="175" r="96" stroke="#FFFFFF" stroke-opacity="0.10"/>
      <circle cx="975" cy="175" r="64" stroke="#FFFFFF" stroke-opacity="0.14"/>

      <g class="orbit-a">
        <circle cx="975" cy="175" r="96" stroke="#C9F67C" stroke-opacity="0.55" stroke-dasharray="64 539" stroke-linecap="round"/>
      </g>

      <g class="orbit-b">
        <circle cx="975" cy="47" r="4" fill="#C9F67C"/>
      </g>

      <g class="orbit-c">
        <circle cx="975" cy="111" r="2.5" fill="#FFFFFF" fill-opacity="0.5"/>
      </g>

      <g class="float">
        <rect x="943" y="143" width="64" height="64" rx="18" fill="#12161A" stroke="#2A3037"/>
        <g transform="translate(959 159)">
          <path d="M16 30V13" stroke="#C9F67C" stroke-width="1.8" stroke-linecap="round"/>
          <path d="M16 22C9.5 22 5.5 17.5 5.5 10.5C12.5 10.5 16 15 16 22Z" fill="#C9F67C" fill-opacity="0.85"/>
          <path d="M16 17C16 10 20 6 27 6C27 12.5 22.5 17 16 17Z" fill="#C9F67C" fill-opacity="0.5"/>
        </g>
      </g>
    </g>

    <rect x="0.5" y="0.5" width="1199" height="359" rx="27.5" stroke="#242930"/>
  </g>
</svg>
